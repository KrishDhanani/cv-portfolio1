# Dataset config for YOLO (Task 1b, data pipeline).
# Local: unzip GarbageSplit into data/processed/ (images/ and labels/ inside).
# Kaggle: run src/data/setup_data.py, which writes the same config
#         with the full Kaggle path to /kaggle/working/GarbageSplit/data.yaml
path: data/processed
train: images/train
val: images/val
test: images/test

names:
  0: biodegradable
  1: cardboard
  2: glass
  3: metal
  4: paper
  5: plastic